version: "3.9"

services:
  database:
    image: postgres:16-alpine
    container_name: itam-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db-data:/var/lib/postgresql/data          # persists data across container restarts
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql  # runs once on first startup
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - itam-network

  redis:
    image: redis:7-alpine
    container_name: itam-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - itam-network

  backend:
    build: ./backend
    container_name: itam-backend
    restart: unless-stopped
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5000
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - itam-network

  frontend:
    build: ./frontend
    container_name: itam-frontend
    restart: unless-stopped
    ports:
      - "8080:80"           # visit http://localhost:8080
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - itam-network

volumes:
  db-data:                  # named volume - survives `docker compose down` (not `-v`)

networks:
  itam-network:              # isolated bridge network - only these 4 services can see each other
    driver: bridge
