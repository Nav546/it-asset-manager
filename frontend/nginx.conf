server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the React SPA - fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API calls to the backend container.
    # "backend" resolves via Docker's internal DNS - it's the service name in docker-compose.yml
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}